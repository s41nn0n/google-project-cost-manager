name: Review and apply FinOps

on:
  pull_request:
    paths: ['policy/**', 'generated/**', 'terraform/**']
  push:
    branches: [main]
    paths: ['policy/**', 'generated/**', 'terraform/**']

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - name: Validate and create machine-readable plan
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform validate
          jq -e '.complete and ((.classifications.blocked // 0) == 0)' ../generated/coverage.json
          terraform plan -input=false -out=reviewed.tfplan
          terraform show -json reviewed.tfplan > reviewed.tfplan.json
          sh ../scripts/reject-unsafe-plan reviewed.tfplan.json
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: terraform/reviewed.tfplan
          retention-days: 5

  apply:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: finops-production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: terraform
      - name: Apply exact approved commit plan
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -input=false reviewed.tfplan
      - name: Append policy only after all billing resources succeed
        working-directory: terraform
        env:
          POLICY_SECRET_ID: ${{ vars.GCP_POLICY_SECRET_ID }}
          CONTROL_PROJECT_ID: ${{ vars.GCP_CONTROL_PROJECT_ID }}
        run: |
          terraform output -raw generated_enforcement_policy_yaml > /tmp/enforcement-policy.yaml
          gcloud secrets versions add "$POLICY_SECRET_ID" --project="$CONTROL_PROJECT_ID" --data-file=/tmp/enforcement-policy.yaml
