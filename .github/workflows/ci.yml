name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t billing-guard:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - name: Check formatting
        run: terraform -chdir=deployments/terraform fmt -check -recursive
      - name: Validate root composition
        run: |
          terraform -chdir=deployments/terraform init -backend=false -input=false
          terraform -chdir=deployments/terraform validate
      - name: Validate standalone modules
        run: |
          for module in bootstrap control-plane billing-account; do
            terraform -chdir="deployments/terraform/modules/$module" init -backend=false -input=false
            terraform -chdir="deployments/terraform/modules/$module" validate
          done
