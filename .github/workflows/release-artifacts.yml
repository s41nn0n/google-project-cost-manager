name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.12'
          cache: true
      - name: Build discovery scanner
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/gcp-finops-discover_linux_amd64 ./cmd/discover
          sha256sum dist/gcp-finops-discover_linux_amd64 > dist/SHA256SUMS
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/gcp-finops-discover_linux_amd64 dist/SHA256SUMS --clobber

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Publish digest on release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release view '${{ github.event.release.tag_name }}' --json body --jq .body > /tmp/release-notes.md
          printf '\nContainer: `ghcr.io/${{ github.repository }}@%s`\n' "$IMAGE_DIGEST" >> /tmp/release-notes.md
          gh release edit '${{ github.event.release.tag_name }}' --notes-file /tmp/release-notes.md
