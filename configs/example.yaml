schemaVersion: 2
organizationId: "123456789012"
controlProjectId: example-finops-control
defaults:
  threshold: 0.8
  dryRun: true
  action: disable_billing
unknownAlertPolicy: ignore
unknownAlertProjects: []
maxProjectsDisabledPerEvent: 1
protectedProjects:
  - example-finops-control
eventState:
  backend: firestore
  projectId: example-finops-control
  databaseId: billing-guard-events
  collection: budget-events
reconcile:
  enabled: true
  sourceOfTruth: terraform
  mode: diff_only
  billingAccountNames:
    - billingAccounts/000000-000000-000000
  requiredPubSubTopic: projects/example-finops-control/topics/billing-budget-alerts
budgets:
  - budgetResourceName: billingAccounts/000000-000000-000000/budgets/11111111-1111-1111-1111-111111111111
    billingAccountName: billingAccounts/000000-000000-000000
    projectId: example-sandbox
    projectNumber: "123456789012"
    enforcementMode: dry_run
    names: []
    projects: [example-sandbox]
    threshold: 0.8
selfTest:
  enabled: true
  mode: dry_run
  testProjectId: example-billing-guard-test
  allowedProjectIdPattern: ^example-billing-guard-test$
  minimumIntervalHours: 24
